name: Add batch import window once

on:
  push:
    paths:
      - ".github/workflows/add-batch-import-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch MainActivity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/anxiousspending/app/MainActivity.kt")
          s = p.read_text()

          old = '''    var showAdd by remember { mutableStateOf(false) }
    var pendingDelete by remember { mutableStateOf<Expense?>(null) }'''
          new = '''    var showAdd by remember { mutableStateOf(false) }
    var showImport by remember { mutableStateOf(false) }
    var pendingDelete by remember { mutableStateOf<Expense?>(null) }'''
          if old not in s:
              raise SystemExit("state anchor not found")
          s = s.replace(old, new, 1)

          old = '''            TopAppBar(title = {
                Column {
                    Text("坚持焦虑地花钱中", fontWeight = FontWeight.SemiBold)
                    Text("Spending Anxiously, Consistently.", style = MaterialTheme.typography.labelSmall)
                }
            })'''
          new = '''            TopAppBar(
                title = {
                    Column {
                        Text("坚持焦虑地花钱中", fontWeight = FontWeight.SemiBold)
                        Text("Spending Anxiously, Consistently.", style = MaterialTheme.typography.labelSmall)
                    }
                },
                actions = {
                    if (page == 0) {
                        TextButton(onClick = { showImport = true }) { Text("导入") }
                    }
                }
            )'''
          if old not in s:
              raise SystemExit("topbar anchor not found")
          s = s.replace(old, new, 1)

          old = '''    if (showAdd) {
        ExpenseDialog('''
          new = '''    if (showImport) {
        BatchImportDialog(
            existingEntries = entries,
            onDismiss = { showImport = false },
            onImport = { imported ->
                persist(entries + imported)
                showImport = false
            }
        )
    }

    if (showAdd) {
        ExpenseDialog('''
          if old not in s:
              raise SystemExit("dialog anchor not found")
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Remove this one-shot workflow
        run: rm .github/workflows/add-batch-import-once.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/anxiousspending/app/MainActivity.kt .github/workflows/add-batch-import-once.yml
          git commit -m "Wire monthly batch import into ledger"
          git push
