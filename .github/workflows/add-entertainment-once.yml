name: Add entertainment category once

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/add-entertainment-once.yml' ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add entertainment category
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/anxiousspending/app/MainActivity.kt')
          s = main.read_text()
          old = '    CategoryOption("game", "游戏", "婷芷我说婷芷"),\n    CategoryOption("ai", "AI", "别BAN我"),'
          new = '    CategoryOption("game", "游戏", "婷芷我说婷芷"),\n    CategoryOption("entertainment", "娱乐", "LET\\\'S PARTY"),\n    CategoryOption("ai", "AI", "别BAN我"),'
          if old not in s:
              raise SystemExit('MainActivity category anchor not found')
          main.write_text(s.replace(old, new, 1))

          analytics = Path('app/src/main/java/com/anxiousspending/app/AnalyticsHub.kt')
          s = analytics.read_text()
          old = '    "game" to "游戏",\n    "ai" to "AI",'
          new = '    "game" to "游戏",\n    "entertainment" to "娱乐",\n    "ai" to "AI",'
          if old not in s:
              raise SystemExit('Analytics category anchor not found')
          analytics.write_text(s.replace(old, new, 1))

          readme = Path('README.md')
          s = readme.read_text()
          old = '- game — `婷芷我说婷芷`\n- ai — `别BAN我`'
          new = '- game — `婷芷我说婷芷`\n- entertainment — `LET\\\'S PARTY`\n- ai — `别BAN我`'
          if old not in s:
              raise SystemExit('README category anchor not found')
          readme.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/add-entertainment-once.yml
          git add app/src/main/java/com/anxiousspending/app/MainActivity.kt app/src/main/java/com/anxiousspending/app/AnalyticsHub.kt README.md .github/workflows/add-entertainment-once.yml
          git commit -m 'Add entertainment expense category'
          git push
