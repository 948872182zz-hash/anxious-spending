name: Refine analytics category chart once

on:
  push:
    paths:
      - '.github/workflows/patch-analytics-a-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make second-layer A a categorical line chart
        env:
          FUNCTION_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, os
          path = Path('app/src/main/java/com/anxiousspending/app/AnalyticsHub.kt')
          text = path.read_text()
          old = '                    else AmountBarList(noteTotals) { onNoteDetail(it.key) }'
          new = '                    else CategoricalNoteLineChart(noteTotals, onNoteDetail)'
          if old not in text:
              raise SystemExit('Expected note chart call not found')
          text = text.replace(old, new, 1)
          marker = '@Composable\nprivate fun CategorySecondLayer('
          if marker not in text:
              raise SystemExit('CategorySecondLayer marker not found')
          function = base64.b64decode(os.environ['FUNCTION_B64']).decode()
          text = text.replace(marker, function + marker, 1)
          path.write_text(text)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-analytics-a-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/anxiousspending/app/AnalyticsHub.kt .github/workflows/patch-analytics-a-once.yml
          git commit -m 'Use line chart for category note comparison'
          git push
