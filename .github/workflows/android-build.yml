name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore fixed debug signing key
        run: |
          base64 --decode ci/debug.keystore.b64 > ci/debug.keystore
          keytool -list -v \
            -keystore ci/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            | grep 'SHA256:'

      - name: Build debug APK
        run: gradle :app:assembleDebug -PbuildNumber=${{ github.run_number }}

      - name: Give APK a visible versioned filename
        run: cp app/build/outputs/apk/debug/app-debug.apk anxious-spending-v0.1.${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anxious-spending-v0.1.${{ github.run_number }}
          path: anxious-spending-v0.1.${{ github.run_number }}.apk
