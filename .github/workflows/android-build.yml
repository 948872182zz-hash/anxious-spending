name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: anxious-spending-debug-keystore-v2

      - name: Ensure stable debug signing key exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -validity 10000 \
              -keyalg RSA \
              -keysize 2048
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug -PbuildNumber=${{ github.run_number }}

      - name: Give APK a visible versioned filename
        run: cp app/build/outputs/apk/debug/app-debug.apk anxious-spending-v0.1.${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anxious-spending-v0.1.${{ github.run_number }}
          path: anxious-spending-v0.1.${{ github.run_number }}.apk
