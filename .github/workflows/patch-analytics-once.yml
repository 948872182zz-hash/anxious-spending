name: Wire analytics hub once

on:
  push:
    paths:
      - '.github/workflows/patch-analytics-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old analysis entry
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/anxiousspending/app/MainActivity.kt')
          text = path.read_text()
          old = '            else AnalysisPage(entries)'
          new = '            else AnalyticsHub(entries)'
          if old not in text:
              raise SystemExit('Expected AnalysisPage call not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-analytics-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/anxiousspending/app/MainActivity.kt .github/workflows/patch-analytics-once.yml
          git commit -m 'Route analysis tab to 2.0 analytics hub'
          git push
